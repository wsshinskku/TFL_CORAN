[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tfl-coran"
version = "1.0.0"
description = "Complete algorithmic reproduction toolkit for TFL-CORAN in 5G Open RAN"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Wooseok Daniel Shin", email = "swsda95@skku.edu"},
]
keywords = ["open-ran", "federated-learning", "reinforcement-learning", "vgae", "5g"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24,<3",
  "PyYAML>=6.0.1,<7",
  "scikit-learn>=1.3,<2",
  "scipy>=1.10,<2",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<9",
  "pytest-cov>=4.1,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
tfl-coran = "tfl_coran.cli:main"

[project.urls]
Repository = "https://github.com/wsshinskku/TFL_CORAN"
Issues = "https://github.com/wsshinskku/TFL_CORAN/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 105
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
